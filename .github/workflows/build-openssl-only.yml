name: Live Interactive Hardware Crypto Build Room (Raw Slates Only)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout OpenWrt Core Code
        uses: actions/checkout@v4
        with:
          repository: 'openwrt/openwrt'
          ref: 'openwrt-25.12'
          path: 'openwrt'

      - name: Install System Dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev python3-setuptools rsync swig unzip zlib1g-dev file wget zstd libz3-dev

      - name: Set Up Package Feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install libsodium hiredis expat
          ./scripts/feeds install unbound-daemon libunbound unbound-control unbound-checkconf unbound-anchor unbound-host

      # 🟩 THE ANTI-CRASH LAYER: Forces a background network ping every 60 seconds to stop 503 timeouts
      - name: Initialize Keep-Alive Session Subsystem
        run: |
          bash -c "while true; do echo 'Keeping connection alive...'; sleep 60; done" &

      # 🟩 THE OPENER: Instantly pauses the machine right here and opens your live connection room
      - name: Open Secure Live Interactive Build Connection
        uses: mxschmitt/action-tmate@v3
        with:
          limit-access-to-actor: false
